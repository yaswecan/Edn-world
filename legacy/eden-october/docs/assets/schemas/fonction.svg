<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Une fonction : entrée, traitement, retour</title><desc id="desc">Le paramètre est le nom dans la déclaration, l’argument la valeur donnée à l’appel. Return renvoie ; console.log affiche.</desc><rect x="3" y="3" width="1094" height="554" rx="20" fill="white" stroke="#142c34" stroke-width="3"/><g font-family="Inter,Arial,sans-serif" fill="#142c34"><text x="42" y="57" font-size="31" font-weight="700">Une fonction : une entrée, un résultat.</text><path d="M42 72 Q350 78 790 72" fill="none" stroke="#62c6c7" stroke-width="7" stroke-linecap="round"/><g font-size="23"><text x="57" y="122">DÉCLARER</text><text x="57" y="164">function doubler(nombre) { return nombre * 2; }</text><text x="430" y="201" font-size="18">↑ paramètre : le nom de l’entrée</text></g><g stroke="#142c34" stroke-width="3" fill="#effbfb"><path d="M56 253 L260 251 L263 352 L57 354 Z"/><path d="M390 252 L648 254 L651 352 L390 355 Z"/><path d="M784 252 L1038 254 L1040 352 L784 354 Z"/></g><g font-size="26" text-anchor="middle" font-weight="700"><text x="158" y="291">doubler(6)</text><text x="520" y="291">6 × 2</text><text x="911" y="291">return 12</text></g><g font-size="18" text-anchor="middle"><text x="158" y="329">6 est un argument</text><text x="520" y="329">le traitement</text><text x="911" y="329">la valeur renvoyée</text></g><g stroke="#142c34" stroke-width="4" fill="#62c6c7"><path d="M286 291 H343 V277 L370 302 L343 325 V311 H286 Z"/><path d="M677 291 H733 V277 L760 302 L733 325 V311 H677 Z"/></g><text x="57" y="411" font-size="23">const resultat = doubler(6);</text><text x="57" y="448" font-size="19">La variable garde 12 : le programme peut la réutiliser.</text><path d="M53 475 Q545 468 1040 475" stroke="#62c6c7" stroke-width="3" fill="none"/><text x="57" y="517" font-size="22" font-weight="700">console.log(resultat) affiche 12. Ce n’est pas return.</text></g></svg>
