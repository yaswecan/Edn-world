<title id="title">COMMENT TROUVER CE QUI BLOQUE ?</title><desc id="desc">Une observation → une hypothèse → un essai → une preuve. Si le rendu reste inattendu, repars de l’observation. Un contrôle réussi ne valide pas toute ton explication.</desc>
